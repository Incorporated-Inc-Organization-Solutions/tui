services:
  mariadb:
    container_name: mariadb-tui
    image: mariadb:11.7
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: true
      MARIADB_DATABASE: tui
      MARIADB_USER: tui
      MARIADB_PASSWORD: changeme
      TZ: Europe/Amsterdam
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  tui:
    build: .
    container_name: tui
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "4675:8080"
    environment:
      - DB__host=mariadb
      - DB__port=3306
      - DB__name=tui
      - DB__user=tui
      - DB__password=changeme

volumes:
  mariadb_data:
